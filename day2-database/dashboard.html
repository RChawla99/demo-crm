<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      padding: 20px 40px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 20px; font-weight: 600; color: #f8fafc; }
    header span { font-size: 14px; color: #94a3b8; }

    .container { padding: 40px; }

    /* LOGIN */
    #login-section {
      max-width: 400px;
      margin: 80px auto;
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    #login-section h2 { margin-bottom: 24px; font-size: 22px; }

    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #2563eb; }

    #error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }

    /* DASHBOARD */
    #dashboard-section { display: none; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
    }

    .stat-card .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .stat-card .number {
      font-size: 36px;
      font-weight: 700;
      color: #f8fafc;
    }

    .stat-card.new .number { color: #94a3b8; }
    .stat-card.contacted .number { color: #60a5fa; }
    .stat-card.qualified .number { color: #34d399; }
    .stat-card.closed .number { color: #a78bfa; }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .filter-btn {
      width: auto;
      padding: 8px 20px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

    .filter-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: white;
    }

    /* LEADS TABLE */
    .leads-table {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }

    .leads-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .leads-table th {
      padding: 14px 20px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      border-bottom: 1px solid #334155;
    }

    .leads-table td {
      padding: 16px 20px;
      font-size: 14px;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }

    .leads-table tr:last-child td { border-bottom: none; }
    .leads-table tr:hover td { background: #263044; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.new { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
    .badge.contacted { background: #1e3a5f; color: #60a5fa; }
    .badge.qualified { background: #064e3b; color: #34d399; }
    .badge.closed { background: #2e1065; color: #a78bfa; }

    .logout-btn {
      width: auto;
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

<header>
  <h1>CRM Dashboard</h1>
  <span id="user-label"></span>
  <button class="logout-btn" onclick="logout()" style="display:none" id="logout-btn">Logout</button>
</header>

<!-- LOGIN -->
<div id="login-section">
  <h2>Sign In</h2>
  <input type="email" id="email" placeholder="Email address" />
  <input type="password" id="password" placeholder="Password" />
  <button onclick="login()">Sign In</button>
  <p id="error-msg"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard-section" class="container">

  <div class="stats-grid">
    <div class="stat-card new">
      <div class="label">New</div>
      <div class="number" id="stat-new">—</div>
    </div>
    <div class="stat-card contacted">
      <div class="label">Contacted</div>
      <div class="number" id="stat-contacted">—</div>
    </div>
    <div class="stat-card qualified">
      <div class="label">Qualified</div>
      <div class="number" id="stat-qualified">—</div>
    </div>
    <div class="stat-card closed">
      <div class="label">Closed</div>
      <div class="number" id="stat-closed">—</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterLeads('all', this)">All</button>
    <button class="filter-btn" onclick="filterLeads('new', this)">New</button>
    <button class="filter-btn" onclick="filterLeads('contacted', this)">Contacted</button>
    <button class="filter-btn" onclick="filterLeads('qualified', this)">Qualified</button>
    <button class="filter-btn" onclick="filterLeads('closed', this)">Closed</button>
  </div>

  <div class="leads-table">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Source</th>
          <th>Status</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody id="leads-body">
      </tbody>
    </table>
  </div>

</div>

<script>
  const API = 'http://127.0.0.1:8000'
  let token = localStorage.getItem('token')

  // On page load, check if already logged in
  if (token) showDashboard()

  async function login() {
    const email = document.getElementById('email').value
    const password = document.getElementById('password').value

    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
    })

    if (!res.ok) {
      document.getElementById('error-msg').textContent = 'Invalid email or password'
      return
    }

    const data = await res.json()
    token = data.access_token
    localStorage.setItem('token', token)
    showDashboard()
  }

  function logout() {
    localStorage.removeItem('token')
    token = null
    document.getElementById('login-section').style.display = 'block'
    document.getElementById('dashboard-section').style.display = 'none'
    document.getElementById('logout-btn').style.display = 'none'
    document.getElementById('user-label').textContent = ''
  }

  async function showDashboard() {
    document.getElementById('login-section').style.display = 'none'
    document.getElementById('dashboard-section').style.display = 'block'
    document.getElementById('logout-btn').style.display = 'block'
    await loadStats()
    await loadLeads()
  }

  async function loadStats() {
    const res = await fetch(`${API}/leads/stats`, {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    const data = await res.json()
    document.getElementById('stat-new').textContent = data.new
    document.getElementById('stat-contacted').textContent = data.contacted
    document.getElementById('stat-qualified').textContent = data.qualified
    document.getElementById('stat-closed').textContent = data.closed
  }

  async function loadLeads(status = null) {
    const url = status ? `${API}/leads?status=${status}` : `${API}/leads`
    const res = await fetch(url, {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    const leads = await res.json()
    renderLeads(leads)
  }

  function renderLeads(leads) {
    const tbody = document.getElementById('leads-body')
    tbody.innerHTML = ''

    if (leads.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b; padding:40px">No leads found</td></tr>'
      return
    }

    leads.forEach(lead => {
      tbody.innerHTML += `
        <tr>
          <td style="color:#f8fafc; font-weight:500">${lead.name}</td>
          <td>${lead.email}</td>
          <td>${lead.phone || '—'}</td>
          <td>${lead.source || '—'}</td>
          <td><span class="badge ${lead.status}">${lead.status}</span></td>
          <td>${lead.notes || '—'}</td>
        </tr>
      `
    })
  }

  function filterLeads(status, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    loadLeads(status === 'all' ? null : status)
  }
</script>

</body>
</html>
